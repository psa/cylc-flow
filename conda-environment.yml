name: cylc-dev
channels:
  - conda-forge
dependencies:
  - aiosmtpd
  - ansimarkup >=1.0.0
  - async_generator
  - bandit >=1.7.0
  - colorama >=0.4,<1.0
  - coverage >=7.9.0
  - flake8 >=3.0.0
  - flake8-broken-line >=0.3.0
  - flake8-bugbear >=21.0.0
  - flake8-builtins >=1.5.0
  - flake8-comprehensions >=3.5.0
  - flake8-debugger >=4.0.0
  - flake8-implicit-str-concat >=0.4
  - flake8-mutable >=1.2.0
  - flake8-simplify >=0.14.0; python_version<"3.14"
  - flake8-type-checking
  - graphene >=3.4.0,<3.5
  - graphql-core >=3.2,<3.3
  - graphviz  # for static graphing
  # Note: can't pin jinja2 any higher than this until we give up on Cylc 7 back-compat
  - jinja2 >=3.0,<3.1
  - metomi-isodatetime >=1!3.0.0, <1!3.2.0
  - mypy >=0.910
  - packaging
  # Constrain protobuf version for compatible Scheduler-UIS comms across hosts
  - protobuf >=4.24.4,<4.25.0
  - psutil >=5.6.0
  - pytest >=6
  - pytest-asyncio >=0.21.2,!=0.23.*
  - pytest-cov >=2.8.0
  - pytest-mock >=3.7
  - pytest-xdist >=2
  - python
  - pyzmq >=22
  - testfixtures >=6.11.0
  - towncrier >=24.7.0
  - types-Jinja2 >=0.1.3
  - types-protobuf >=0.1.10,!=5.29.1.20250402
  - urwid >=2.2,<4,!=2.6.2,!=2.6.3

# optional dependencies
  #- pandas >=1.0,<2
  #- pympler
  #- matplotlib-base
  #- sqlparse
  #- h5py
  #- requests
